[project]
name = "dangote-refinery-optimizer"
version = "0.1.0"
description = "ML surrogate + differential evolution for crude blend optimization at refinery scale — portfolio methodology demo (free/open data only)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "batestguy" }]
keywords = ["refinery", "optimization", "surrogate-model", "differential-evolution", "energy"]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "plotly>=5.20",
    "marimo>=0.23.0",  # CVE-2026-39987 (pre-auth RCE) fixed in 0.23.0 — floor pinned at Phase 6 kickoff (spec open item 5); uv.lock carries 0.24.2
    "python-dotenv>=1.0",
    "requests>=2.31",
    "datasets>=3.0",  # HF streaming only (CrudeOilMix, Electric Sheep) — never bulk-download
    "pdfplumber>=0.11.10",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dangote_opt"]

[tool.uv]
# default: project installs editable into the venv on `uv sync`

[tool.ruff]
line-length = 100
src = ["src", "tests", "app"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
